<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live In-Memory Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #030712;
      color: #f9fafb;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div class="badge">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #22c55e;"></span>
      MongoDB Atlas Live Runner
    </div>
    <h3 id="loader-title" style="color: #f8fafc; font-size: 1.15rem; font-weight: 600; margin-bottom: 0.4rem;">
      Compiling In-Memory Preview...
    </h3>
    <p id="loader-desc" style="font-size: 0.85rem; color: #64748b; max-width: 440px; line-height: 1.5;">
      Loading components and design tokens directly from MongoDB Atlas.
    </p>
  </div>

  <div id="root"></div>

  <script type="module">
    // Load Lucide Icons from ESM
    let LucideIcons = {};
    try {
      LucideIcons = await import('https://esm.sh/lucide-react@0.460.0?deps=react@18.3.1');
    } catch (e) {
      console.warn('Lucide icons fallback active');
    }

    // Modern Next.js and Utility Shims
    window.React = window.React || React;
    window.ReactDOM = window.ReactDOM || ReactDOM;

    // Safeguard React.createElement against Minified Error #130
    const origCreateElement = React.createElement;
    React.createElement = function(type, ...args) {
      if (type === undefined) {
        return origCreateElement.call(React, 'div', { 'data-missing': true }, ...args);
      }
      if (typeof type === 'object' && type !== null && !type.$$typeof) {
        const unwrapped = type.default || Object.values(type).find(v => typeof v === 'function' || (v && v.$$typeof));
        if (unwrapped) {
          return origCreateElement.call(React, unwrapped, ...args);
        }
        return origCreateElement.call(React, 'div', { 'data-fallback': true }, ...args);
      }
      return origCreateElement.call(React, type, ...args);
    };

    const NextLink = function({ href, children, className, ...props }) {
      return React.createElement('a', { href: href || '#', className, ...props }, children);
    };

    const NextImage = function({ src, alt, width, height, className, ...props }) {
      return React.createElement('img', { src, alt: alt || '', width, height, className, loading: 'lazy', ...props });
    };

    const NextFont = function() {
      return { className: '', variable: '' };
    };

    // clsx & twMerge shim
    function clsxShim(...args) {
      return args
        .flat()
        .filter(Boolean)
        .map(x => typeof x === 'object' ? Object.keys(x).filter(k => x[k]).join(' ') : x)
        .join(' ');
    }

    function twMergeShim(...args) {
      return clsxShim(...args);
    }

    function cvaShim(base, config) {
      return function(props = {}) {
        let classes = base || '';
        if (config && config.variants) {
          for (const key of Object.keys(config.variants)) {
            const val = props[key] || (config.defaultVariants && config.defaultVariants[key]);
            if (val && config.variants[key][val]) {
              classes += ' ' + config.variants[key][val];
            }
          }
        }
        if (props.className) classes += ' ' + props.className;
        return classes;
      };
    }

    async function initPreview() {
      const urlParams = new URLSearchParams(window.location.search);
      const projectName = urlParams.get('project');
      const loader = document.getElementById('loader');
      const loaderTitle = document.getElementById('loader-title');

      if (!projectName) {
        loader.innerHTML = '<p style="color:#ef4444; font-weight:600;">No project specified in URL query.</p>';
        return;
      }

      loaderTitle.innerText = `Loading "${projectName}" from MongoDB...`;

      try {
        const res = await fetch(`/api/projects/${encodeURIComponent(projectName)}/bundle`);
        if (!res.ok) throw new Error(`Project "${projectName}" not found in MongoDB.`);
        const bundle = await res.json();

        // 1. Inject Stylesheet (globals.css + design tokens)
        if (bundle.files['/styles.css'] && bundle.files['/styles.css'].code) {
          const styleEl = document.createElement('style');
          // Strip @import "tailwindcss" to avoid localhost:3000/tailwindcss 404
          const cleanCss = bundle.files['/styles.css'].code.replace(/@import\s+["']tailwindcss["'];?/g, '');
          styleEl.innerHTML = cleanCss;
          document.head.appendChild(styleEl);
        }

        // Configure Tailwind extensions
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                background: 'var(--background, #030712)',
                foreground: 'var(--foreground, #f9fafb)',
                primary: 'var(--primary, #6366f1)',
                muted: 'var(--muted, #1f2937)',
                accent: 'var(--accent, #38bdf8)',
              },
              fontFamily: {
                heading: ['Outfit', 'sans-serif'],
                body: ['Inter', 'sans-serif'],
              }
            }
          }
        };

        // Framer Motion Universal Proxy
        const tagCache = {};
        const motionProxy = new Proxy({}, {
          get(target, prop) {
            if (typeof prop !== 'string') return undefined;
            if (prop === '$$typeof' || prop === '__esModule' || prop === 'then') return undefined;
            if (!tagCache[prop]) {
              const Comp = React.forwardRef((props = {}, ref) => {
                const {
                  initial, animate, exit, transition, whileHover, whileTap,
                  whileInView, viewport, variants, ...domProps
                } = props;
                return React.createElement(prop, { ...domProps, ref });
              });
              Comp.displayName = `motion.${prop}`;
              tagCache[prop] = Comp;
            }
            return tagCache[prop];
          }
        });

        const FramerMotion = {
          default: { motion: motionProxy, AnimatePresence: ({ children }) => children },
          motion: motionProxy,
          AnimatePresence: ({ children }) => children,
          useAnimation: () => ({ start: () => {}, stop: () => {} }),
          useInView: () => true,
          __esModule: true,
        };

        // Lucide Icons Universal Proxy
        const iconCache = {};
        const LucideProxy = new Proxy(LucideIcons, {
          get(target, prop) {
            if (typeof prop !== 'string') return target[prop];
            if (prop === '__esModule') return true;
            if (prop === '$$typeof' || prop === 'then') return undefined;
            if (prop in target && (typeof target[prop] === 'function' || (target[prop] && target[prop].$$typeof))) {
              return target[prop];
            }
            if (!iconCache[prop]) {
              const FallbackIcon = (props = {}) => React.createElement('svg', {
                width: 20,
                height: 20,
                viewBox: '0 0 24 24',
                fill: 'none',
                stroke: 'currentColor',
                strokeWidth: 2,
                ...props
              }, React.createElement('circle', { cx: 12, cy: 12, r: 9 }));
              FallbackIcon.displayName = `Lucide.${prop}`;
              iconCache[prop] = FallbackIcon;
            }
            return iconCache[prop];
          }
        });

        // 2. In-Memory Module System
        const moduleCache = {};
        const rawFiles = bundle.files;

        function normalizePath(p) {
          return p.replace(/^\.?\//, '').replace(/\.(tsx|ts|jsx|js)$/, '');
        }

        function resolveModule(importPath, currentFilePath) {
          if (importPath === 'react' || importPath === 'react/jsx-runtime') {
            return { default: React, ...React, __esModule: true };
          }
          if (importPath === 'react-dom' || importPath === 'react-dom/client') {
            return { default: ReactDOM, ...ReactDOM, __esModule: true };
          }
          if (importPath === 'framer-motion') {
            return FramerMotion;
          }
          if (importPath === 'lucide-react') {
            return LucideProxy;
          }
          if (importPath === 'clsx') return { default: clsxShim, clsx: clsxShim, __esModule: true };
          if (importPath === 'tailwind-merge') return { default: twMergeShim, twMerge: twMergeShim, __esModule: true };
          if (importPath === 'class-variance-authority') return { default: cvaShim, cva: cvaShim, __esModule: true };
          if (importPath.includes('next/link')) return { default: NextLink, Link: NextLink, __esModule: true };
          if (importPath.includes('next/image')) return { default: NextImage, Image: NextImage, __esModule: true };
          if (importPath.includes('next/font')) return new Proxy({}, { get: () => NextFont });

          // Local file resolution
          let target = importPath.replace(/^@\//, 'src/').replace(/^\.?\//, '');
          target = normalizePath(target);

          for (const key of Object.keys(rawFiles)) {
            const normalizedKey = normalizePath(key);
            if (normalizedKey === target || normalizedKey.endsWith('/' + target) || target.endsWith(normalizedKey)) {
              return executeModule(key);
            }
          }

          console.warn('Could not resolve module:', importPath);
          return { __esModule: true };
        }

        function executeModule(filePath) {
          const norm = normalizePath(filePath);
          if (moduleCache[norm]) return moduleCache[norm].exports;

          const fileObj = rawFiles[filePath];
          if (!fileObj || !fileObj.code) return {};

          const module = { exports: {} };
          moduleCache[norm] = module;

          // Compile with Babel Standalone
          const transformed = Babel.transform(fileObj.code, {
            presets: ['react', 'typescript'],
            plugins: ['transform-modules-commonjs'],
            filename: filePath,
          }).code;

          const customRequire = (reqPath) => resolveModule(reqPath, filePath);

          try {
            const fn = new Function('require', 'module', 'exports', 'React', transformed);
            fn(customRequire, module, module.exports, React);
          } catch (err) {
            console.error(`Error executing ${filePath}:`, err);
          }

          if (!module.exports.__esModule) {
            module.exports.__esModule = true;
          }
          const namedKeys = Object.keys(module.exports).filter(k => k !== '__esModule' && k !== 'default');
          if (!module.exports.default && namedKeys.length > 0) {
            module.exports.default = module.exports[namedKeys[0]];
          }

          return module.exports;
        }

        // 3. Find and Render Page, Navbar, and Footer Components
        let pageExports = null;
        let NavbarComp = null;
        let FooterComp = null;

        for (const path of Object.keys(rawFiles)) {
          if (path.includes('navbar.tsx')) {
            try {
              const exp = executeModule(path);
              NavbarComp = exp.default || exp.Navbar || Object.values(exp)[0];
            } catch (e) { console.warn('Navbar load error:', e); }
          }
          if (path.includes('footer.tsx')) {
            try {
              const exp = executeModule(path);
              FooterComp = exp.default || exp.Footer || Object.values(exp)[0];
            } catch (e) { console.warn('Footer load error:', e); }
          }
          if (path.includes('page.tsx') || path.includes('page.jsx')) {
            try {
              pageExports = executeModule(path);
            } catch (e) { console.warn('Page load error:', e); }
          }
        }

        const PageComponent = (pageExports && (pageExports.default || Object.values(pageExports)[0])) || null;

        if (PageComponent) {
          loader.style.display = 'none';
          const rootEl = document.getElementById('root');
          const root = ReactDOM.createRoot(rootEl);

          root.render(
            React.createElement('div', { className: 'min-h-screen flex flex-col bg-background text-foreground' },
              NavbarComp ? React.createElement(NavbarComp) : null,
              React.createElement('main', { className: 'flex-1' }, React.createElement(PageComponent)),
              FooterComp ? React.createElement(FooterComp) : null
            )
          );
        } else {
          throw new Error('No page component found in the project files.');
        }

      } catch (err) {
        console.error('Preview error:', err);
        loader.innerHTML = `
          <div style="background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 10px; padding: 1.75rem; max-width: 500px;">
            <p style="color:#ef4444; font-weight:600; margin-bottom:0.5rem; font-size: 1.05rem;">Preview Error</p>
            <p style="color:#94a3b8; font-size:0.875rem; line-height: 1.5;">${err.message}</p>
          </div>
        `;
      }
    }

    initPreview();
  </script>
</body>
</html>
